<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rap Anime Ideas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎤 RAP ANIME IDEAS</h1>
    <p>Generador de ideas de raps sobre los animes en tendencia</p>
</header>

<main class="contenedor">

    <!-- 1. ELEGIR ANIME -->
    <section>
        <div class="seccionHeader">
            <h2>1. Elige un anime en tendencia</h2>
            <input id="buscar" placeholder="Buscar anime...">
        </div>
        <div id="listaAnimes" class="grid"></div>
    </section>

    <!-- 2. OPCIONES -->
    <section class="opciones">
        <h2>2. Ajusta el estilo</h2>
        <div class="formulario">
            <label>Estilo
                <select id="estilo"></select>
            </label>
            <label>Enfoque
                <select id="enfoque"></select>
            </label>
            <label>Ánimo
                <select id="animo"></select>
            </label>
        </div>
        <div class="botones">
            <button id="btnGenerar" class="principal">⚡ Generar idea</button>
            <button id="btnSorpresa">🎲 Sorpréndeme</button>
        </div>
    </section>

    <!-- 3. RESULTADO -->
    <section id="resultado" class="oculto">
        <div class="resultadoHeader">
            <h2>3. Tu idea</h2>
            <div class="botones">
                <button id="btnOtra">🔄 Otra versión</button>
                <button id="btnCopiar">📋 Copiar</button>
                <button id="btnFavorito">⭐ Guardar</button>
            </div>
        </div>
        <article id="idea"></article>
    </section>

    <!-- FAVORITOS -->
    <section>
        <h2>⭐ Ideas guardadas</h2>
        <ul id="listaFavoritos"></ul>
    </section>

</main>

<div id="aviso"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
